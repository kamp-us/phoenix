<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<title>kamp.us tree mark</title>
	<!--
		The viewBox is 32 units so one unit is one pixel in the 32px cut and half a pixel in the 16px
		one, which is what lets a stroke be aimed at the tab's pixel grid rather than at an abstract
		canvas. The geometry is shared by every cut and the weights are variables so one cut can be
		re-tuned without touching another — but only one is: the trunk in the 16px cut. It is the
		mark's one straight vertical, centred at x=16, which at half a pixel per unit is device x 8.0,
		a pixel boundary; a stroke centred on a boundary paints whole columns only at an even device
		width, so the base 2.6 (1.3 device px) smears across two columns at 65% and `--w-trunk: 4.0`
		(2.0 device px) paints both of them solid. `favicon-16.png` is this file rendered at 16px with
		that one override. Nothing else re-tunes: an arc and a diagonal have no column to land on, and
		`favicon-32.png`, `favicon-192.png` and `apple-touch-icon.png` are this file rendered at their
		own size exactly as it stands.

		The canopy is left open at the bottom on purpose — the limbs reach into that mouth without
		touching the outline, and that ring of unpainted plate is the gap the mark lives or dies by at
		16px.
	-->
	<style>
		svg {
			--w-canopy: 2.2;
			--w-trunk: 2.6;
			--w-limb: 1.9;
		}
		.plate { fill: #16181a; }
		.mark {
			fill: none;
			stroke: #f04438;
			stroke-linecap: round;
			stroke-linejoin: round;
		}
		.canopy { stroke-width: var(--w-canopy); }
		.trunk { stroke-width: var(--w-trunk); }
		.limb { stroke-width: var(--w-limb); }
	</style>
	<rect class="plate" width="32" height="32" />
	<g class="mark">
		<path
			class="canopy"
			d="M8.72 18.14
			   A2.8 2.8 0 0 1 6.58 14.04
			   A2.8 2.8 0 0 1 7.39 9.62
			   A2.8 2.8 0 0 1 10.90 6.25
			   A2.8 2.8 0 0 1 16.00 5.00
			   A2.8 2.8 0 0 1 21.10 6.25
			   A2.8 2.8 0 0 1 24.61 9.62
			   A2.8 2.8 0 0 1 25.42 14.04
			   A2.8 2.8 0 0 1 23.28 18.14"
		/>
		<path class="trunk" d="M16 27V20.5" />
		<path class="limb" d="M16 20.8V13.5M16 20.8L12.4 16.3M16 20.8L19.6 16.3M16 26.4L12.7 28.1M16 26.4L19.3 28.1" />
	</g>
</svg>
