<!--
	The kamp.us tree mark: the founder-supplied drawing, traced to vector so a size is re-rendered
	rather than resampled. This file is the source; every PNG under `public/` is cut from it, and a
	shape change is an edit here plus a re-cut of all four.

	The paths sit inside potrace's own `scale(0.1)` group, so a `stroke-width` set on that group is
	divided by ten before it paints — which is why the 16px cut's override is in the tens, not in
	single units. See `../README.md` for what that override is for.
-->
