<!doctype html>
<!--
	`data-theme` and `data-color-theme` are how `@kampus/design`'s token layer is switched, and the
	desk is dark-only window chrome: there is no light branch to fall back to and nothing reads
	`prefers-color-scheme`. `indigo` is the accent nearest the desk's own blue, so the palette and the
	surface behind it read as one system.
-->
<html lang="en" data-theme="dark" data-color-theme="indigo">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<!--
			The mark carries its own near-black plate rather than a transparent ground, which is what
			lets one file sit on a light tab strip and the dark desk alike — a knocked-out tree would
			vanish on the light one. Sizes are shipped rather than left to the browser because the
			canopy is line art: downscaling 400px to a 16px tab in one step closes the gaps between
			the branches into a blob.
		-->
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<title>Tuval</title>
	</head>
	<body>
		<div id="tuval"></div>
		<script type="module" src="/src/page/main.tsx"></script>
	</body>
</html>
