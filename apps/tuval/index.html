<!doctype html>
<!--
	`data-theme` and `data-color-theme` are how `@kampus/design`'s token layer is switched, and the
	desk is dark-only window chrome: there is no light branch to fall back to and nothing reads
	`prefers-color-scheme`. `indigo` is the accent nearest the desk's own blue, so the palette and the
	surface behind it read as one system.
-->
<html lang="en" data-theme="dark" data-color-theme="indigo">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<!-- Why one cut per size and no SVG icon: README.md, "The static root". -->
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<title>Tuval</title>
	</head>
	<body>
		<div id="tuval"></div>
		<script type="module" src="/src/page/main.tsx"></script>
	</body>
</html>
