name: readme-guard

# CI gate for #938/#939: every `packages/*` workspace package must carry a
# `README.md` (what it is, why it exists, how to use it). Nothing enforced this, so
# two packages drifted README-less (ci-required, worker-relevance) — the same
# silent-drift class as the schema-mirror (#859) and node:sqlite (#930) incidents.
# This job scopes to real workspace members (dirs with a package.json) so it ignores
# dead-shell dirs, and fails closed if it scans zero members (ADR 0092). The scan lives
# once in fabrika-cli's `guard` group (#6093), which every ported guard shares.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: check every packages/* member has a README.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Non-zero on three distinct seats, so a red says which thing happened: 12 a member
      # lacks a README.md, 7 zero scope (fail-closed, ADR 0092), 11 a read failed so the
      # verdict is UNKNOWN. The report is on stderr, with ::error annotations beside it.
      # Reproduce locally with the same verb. See #938/#939.
      - name: Check every packages/* member has a README
        run: node packages/fabrika-cli/src/bin.ts guard readme-guard check
