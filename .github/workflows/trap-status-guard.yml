name: trap-status-guard

# Guard-shape enforcement (#4479): reds when one runnable shell unit in the plugin corpus
# enables `errexit` alongside an `EXIT` trap. On bash 3.2 — the interpreter every local macOS
# run gets via `#!/usr/bin/env bash` — a `set -u` abort under `-e` reaches the trap with `$?`
# already 0, so a `rm -rf "$tmp"` cleanup makes the script exit 0: a guard reports success on
# the path it aborted in. The measured matrix and the bash >= 4 caveat live in
# .patterns/skill-script-shell-shape.md.
#
# The corpus is `*.md` AND `*.sh`: epic #4435 is moving fenced shell into per-skill
# `scripts/*.sh`, so a `.md`-only scan would go blind exactly as the shape multiplies (#4486).
#
# Scans the FULL corpus (not just changed files), so a pairing anywhere is caught regardless of
# which PR introduced it, and FAILS CLOSED on zero scope per ADR 0092 — per surface: no file
# scanned, no runnable `.md` fence, or no `.sh` file is exit 3.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  guard:
    name: no errexit + EXIT trap in one shell unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Scan the plugin corpus for an errexit + EXIT-trap pairing
        run: |
          set -uo pipefail
          find claude-plugins -type f \( -name '*.md' -o -name '*.sh' \) -print0 \
            | sort -z \
            | xargs -0 node packages/pipeline-cli/src/bin.ts trap-status-guard check
