name: decisions-index

# The PR-side ADR-file validation for ambient ADR discovery (ADR 0126, #1718):
# there is no committed `.decisions/index.md` anymore, so nothing is regenerated
# or pushed on merge. `validate` remains the number-lock backstop — it asserts the
# ADR files carry no duplicate `id` and no filename/front-matter number mismatch
# (the #1471 collision class, the ADR 0074 number-lock). Discovery is ambient: the
# compact map is emitted by `pipeline-cli decisions-index compact` and injected via
# a SessionStart hook (#1728), with `ls .decisions/` + frontmatter as the fallback.
on:
  pull_request:
  push:
    branches: [main]
  # The number-lock's only cross-PR view (#5841). `validate` reads the tree it is checked out on,
  # so on `pull_request` it sees one branch and two pull requests each minting 0284 are both green;
  # the duplicate first exists on the batched `merge_group` ref, which nothing read before this.
  #
  # It reports, it does not block: this job is not one of the base branch's required contexts
  # (`ci-required`, `validate skill frontmatter`, `scan changed files for leaks`), so a batch merges
  # over its red and `main` lands red anyway. ADR 0132 §CI-under-batch still lists decisions-index
  # among the workflows that get no `merge_group:` trigger; this departs from it on the founder
  # ruling of 2026-08-16 on #5841. Promoting the context and amending 0132 are tracked on #5869.
  merge_group:

permissions:
  contents: read

jobs:
  validate:
    name: validate ADR files — no duplicate/mismatched ADR number
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Exit 1 on a duplicate ADR id or a filename/front-matter number mismatch
      # (reason on stderr); any other non-zero means the run could not complete.
      - name: Validate decisions ADR files
        run: node packages/pipeline-cli/src/bin.ts decisions-index validate
