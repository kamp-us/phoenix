name: roadmap-guard

# CI gate for roadmap map #2620 / founder ruling #2628: ROADMAP.md's founder-voice
# `## Arcs`/`## Campaigns` tables and the GitHub milestone projection they pin to must
# stay in sync — sync-drift diligence is load-bearing, so it is GUARDED fail-closed, not
# left to vigilance. The tool parses ROADMAP.md (the sole parsed surface) and validates
# I1–I5 against the live milestone REST projection:
#   I1 arc/campaign pinned to an existing milestone by number (a queued arc may defer)
#   I2 exactly one active arc  ·  I3 no unclaimed open milestone
#   I4 fail-closed on zero scope (ADR 0092)
#   I5 active↔done state symmetry — an active row's milestone is open, a done row's closed
#      (the campaign lifecycle guard, #2660)
# The check lives once in fabrika-cli (`guard roadmap-guard check`); this workflow only wires
# it to the four triggers.
on:
  # Block a PR that drifts ROADMAP.md ↔ milestones.
  # No `push: main` (#5085): the scan is repo-wide, but the `milestone` event and the weekly
  # schedule below already cover post-merge drift, so a `main` run would add no coverage.
  pull_request:
  # Re-check when a milestone is created/edited/closed/reopened/deleted — the projection
  # side of the contract just moved.
  milestone:
  # Weekly backstop: the projection can drift with no PR touching ROADMAP.md (a milestone
  # closed out of band). On red, file a status:needs-triage issue (the report-on-drift path).
  schedule:
    # Monday 05:23 UTC — off-hours and off the top of the hour (the scheduler congests
    # on-the-hour crons). Weekly keeps the filed-issue rate low enough to stay signal.
    - cron: "23 5 * * 1"
  # Manual re-run.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read # checkout
  issues: write # file the drift issue on a scheduled red

jobs:
  check:
    name: check ROADMAP.md ↔ milestone sync (I1–I4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The guard reads the live milestone projection over `gh api`, so it needs a token.
      # `set +e` is load-bearing: GitHub runs a `run:` block under `bash -e`, so a red check would
      # abort the step at the pipeline and never write `code=` — leaving the gate below reading an
      # output the failure itself erased (#5560). The exit code is recorded on both paths, and the
      # step stays green so no `continue-on-error` is needed to reach the two steps after it.
      - name: roadmap-guard check
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set -uo pipefail
          node packages/fabrika-cli/src/bin.ts guard roadmap-guard check 2>&1 | tee guard-output.txt
          echo "code=${PIPESTATUS[0]-}" >> "$GITHUB_OUTPUT"

      # Scheduled drift → file a status:needs-triage issue (the out-of-band drift the PR
      # trigger can't see). No PR to block on a schedule run, so the issue IS the signal.
      #
      # Keyed on `12` (a PROVEN violation), not on any non-zero: the guard group splits its
      # refusals three ways (7 zero scope, 11 unreadable, 12 violation), and a `11` filed under
      # this title would report drift the guard never saw. The other two red the job below.
      - name: File a status:needs-triage issue on scheduled drift
        if: ${{ github.event_name == 'schedule' && steps.guard.outputs.code == '12' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2016  # backticks are intended-literal markdown in the issue body, not shell expansion
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "roadmap-guard: ROADMAP.md ↔ milestone drift detected" \
            --label "status:needs-triage" \
            --body "$(printf 'The weekly roadmap-guard sweep found ROADMAP.md ↔ GitHub-milestone drift. Reconcile ROADMAP.md'\''s `## Arcs`/`## Campaigns` tables with the milestone projection (roadmap map #2620; invariants I1–I4, #2632).\n\nGuard output:\n\n```\n%s\n```\n' "$(cat guard-output.txt)")"

      # Block the PR / milestone-event / dispatch run on red, and a schedule run too when the
      # code is anything but the `12` already filed above — an unreadable projection (11) or an
      # empty scan (7) is an unanswered question, never a pass.
      #
      # The step runs on every path it does not hand to the filing step above, and decides pass/fail
      # in bash rather than in the `if:` — only `0` passes, so an empty code (the check step failed
      # to record one) reds the job instead of resolving to green (ADR 0092).
      - name: Fail the job on drift or an unanswered scan
        if: ${{ !(github.event_name == 'schedule' && steps.guard.outputs.code == '12') }}
        env:
          CODE: ${{ steps.guard.outputs.code }}
        run: |
          set -uo pipefail
          if [ "${CODE-}" = "0" ]; then
            echo "roadmap-guard: ROADMAP.md and the milestone projection are in sync."
            exit 0
          fi
          echo "roadmap-guard: exit '${CODE-}' — 12 is ROADMAP.md ↔ milestone drift, 11 an unreadable ROADMAP.md or projection, 7 an empty scan, and an empty code means the check step never recorded one. See the check step output above." >&2
          exit 1
