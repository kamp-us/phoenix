name: leak-guard

# The authoritative leak gate (issue #312). CI is the only surface that sees
# every PR's diff regardless of how it was authored (agent tool, vim, cat >,
# a human commit), so it — not a write-time hook — is the unbypassable gate for
# the no-local-paths rule (#158/#173). The deny-list lives once in the verb
# (`fabrika guard leak-guard scan`), never re-grepped here.
on:
  # No `push: main` (#5085): this scan's scope IS the diff (`git diff base...HEAD`), so a
  # `main` run would re-scan history rather than the change under review.
  pull_request:
  # `scan changed files for leaks` is a branch-protection-REQUIRED status check, so the
  # merge queue awaits it on the batched `merge_group` ref before it can merge; without
  # this trigger that required check never runs on the batch and every queued merge hangs
  # (ADR 0132).
  merge_group:
  # `scan changed files for leaks` is also required on the standing Release PR, whose branch
  # is pushed by release-please with `secrets.GITHUB_TOKEN` — an event raised with that token
  # creates no workflow run, so `pull_request` above never fires there (#5718).
  # `workflow_dispatch` always creates a run whatever token raised it, so release-please.yml
  # re-dispatches this workflow at the branch head. See the base resolution below for the
  # diff basis a dispatched run uses.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  scan:
    name: scan changed files for leaks
    runs-on: ubuntu-latest
    steps:
      # Full history so the base...head diff resolves; the default shallow
      # checkout has no merge-base for the comparison below.
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # base...head = files this change adds/changes vs the merge-base with the target
      # branch (--diff-filter=ACMR drops deletions/renames-source). The scanner
      # self-scopes to doc surfaces, so we hand it every changed file; a diff with
      # no changed files (or none surviving the filter) is a clean pass — we skip
      # the invocation entirely rather than call `scan` with zero args.
      #
      # On `pull_request` the base is `github.base_ref` (the target branch). On the
      # merge queue's batched `merge_group` ref `base_ref` is empty, so we diff against
      # the batch's `merge_group.base_sha` — the base commit the queue built the batch on
      # (ADR 0132) — which yields exactly the files the batch adds vs main.
      #
      # On `workflow_dispatch` (#5718) BOTH are empty: a dispatch carries a ref, not a base.
      # The dispatched ref is a branch targeting `main`, so `main` is the base, and the
      # three-dot `<base>...HEAD` below already resolves it to the merge-base — the same file
      # set the `pull_request` arm would scan. Ordering matters: `merge_group.base_sha` is
      # tested for CONTENT rather than assumed from the event, so an empty one can never
      # reach `git fetch origin ""` and scan a base of nothing.
      - name: Scan PR diff for leaks
        env:
          BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            base="origin/$BASE_REF"
          elif [ -n "$MERGE_GROUP_BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$MERGE_GROUP_BASE_SHA"
            base="$MERGE_GROUP_BASE_SHA"
          else
            # FETCH_HEAD and not `origin/main`: actions/checkout pins `remote.origin.fetch` to
            # the ref it checked out, so a fetch of a DIFFERENT branch need not update that
            # branch's remote-tracking ref, and `origin/main` can name nothing here. No
            # `--depth` either — a shallow main has no merge base for the three-dot below.
            git fetch --no-tags origin main
            # `--verify`, and the resolution read inside an `if`: plain `git rev-parse` on an
            # unresolvable ref prints the ref back on stdout and exits 128, so an
            # emptiness test downstream would see a non-empty base and scan a diff against
            # nothing. `--verify` refuses instead, and the `if` is what lets this step say so
            # rather than take the runner's bare errexit abort.
            if ! base=$(git rev-parse --verify FETCH_HEAD); then
              echo "::error::could not resolve a diff base from origin/main — refusing to report a clean scan over a base of nothing."
              exit 1
            fi
          fi
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "$base...HEAD")
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changed files — nothing to scan."
            exit 0
          fi
          printf 'Scanning %d changed file(s):\n' "${#changed[@]}"
          printf '  %s\n' "${changed[@]}"
          node packages/fabrika-cli/src/bin.ts guard leak-guard scan "${changed[@]}"
