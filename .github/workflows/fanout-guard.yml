name: fanout-guard

# CI gate for #1898 (ADR 0155): a mutation over a fate-live fanned entity (Post /
# Comment / Definition, in the posts / Post.comments / Term.definitions topics) must
# publish the /fate/live invalidation after its write — else every other client's live
# view goes stale. That omission is invisible at the mutation site (the publisher's
# error channel is `never`), which is why four features shipped it silently (#1893–#1896).
# This job runs `fabrika guard fanout-guard check`: every Fate.mutation must be classified
# fanned/not in apps/web/worker/features/fate-live/fanned-mutations.ts (drift check), and
# every fanned mutation's feature must reference a WorkerLivePublisher publish aimed at its
# declared topic. It fails closed on zero discovered mutations (ADR 0092).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: check every fanned mutation publishes its /fate/live invalidation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Non-zero when a mutation is unclassified (12), a fanned mutation's feature omits the
      # publish (12), zero mutations are in scope (7) or a source could not be read (11).
      # Report on stderr. See #1898.
      - name: Check every fanned mutation publishes
        run: node packages/fabrika-cli/src/bin.ts guard fanout-guard check
