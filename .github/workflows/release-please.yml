# Derives each publishable package's next version from conventional commits and parks
# the answer in a standing Release PR (ADR 0239). Merging that PR is the human release
# act: it tags `<component>-v<version>`, the tag creates the GitHub Release, and the
# `release: published` event is what fires `publish.yml`. Nothing here publishes — this
# workflow has no registry credential and release-please has no publish path.
#
# Routing is by CHANGED FILE PATH, not by commit scope (ADR 0239 §1): a commit is
# assigned to a package root by the files it touched, so `fix(pipeline): …` still bumps
# whichever package its diff landed in, and a commit touching no package root bumps
# nothing.
#
# The `<component>-v<version>` tag grammar is what `publish.yml` guards and what
# `publish-isolation-guard` machine-reads out of that workflow to derive its own scope,
# so the components below must stay `pipeline-cli` / `fabrika-cli` (ADR 0239 §4).
#
# Two hazards this file is wired against, both from ADR 0239 §5:
#
#   `releases_created` is REPO-WIDE — true when ANY configured path released, silent
#   about which. It is NOT "always true" (release-please-action v4.4.1/v5.0.0 set it to
#   `releases.length > 0` in `outputReleases`), which makes it worse, not better: it
#   looks trustworthy and would gate a pipeline-cli action on a fabrika-cli release.
#   Every condition here keys on the per-path `<path>--release_created` output instead.
#
#   The history boundary lives in `release-please-config.json` as `last-release-sha`
#   (with `bootstrap-sha` at the same commit for the never-released fabrika-cli leaf).
#   Without it the first run has no stopping point and folds ~94 commits of pipeline-cli
#   backlog into one bump. npm versions are immutable, so the first Release PR
#   is read before it is merged, never after.
#
# ADR 0069 boundary: `changelog.yml` owns the ROOT CHANGELOG.md, derived from pipeline
# metadata on the same `*-v*` tag. release-please writes PER-PACKAGE CHANGELOG.md files
# under each package root (the node strategy prefixes `changelog-path` with the package
# path). Different files, different sources — pointing release-please at the root
# changelog is banned.
name: release-please

on:
  push:
    branches: [main]

# release-please opens/updates the Release PR and creates releases + tags on merge.
# No `id-token` — this workflow never touches a registry; `publish.yml` mints the OIDC
# credential on the release event.
permissions:
  contents: write
  pull-requests: write
  # `actions: write` dispatches the two kick steps below; `checks: read` is the idempotency
  # probe one of them reads before dispatching (#5718).
  actions: write
  checks: read

# Never cancel in flight: a cancelled run can leave the standing Release PR groomed
# against a stale commit range.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: derive versions and groom the standing Release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # #5946. release-please copies each commit subject verbatim into the Release PR
      # body, then on the NEXT run reads that body back through an HTML parser — one
      # subject's literal `<details>` gave it an element with no `<summary>` and every
      # run died on `summary.match(...)` for 20 hours. Repairing the body by hand does
      # not hold: the next green run rebuilds it from the same subject. So the repair
      # runs before every read, and the tool prints nothing when there is nothing to fix.
      - name: Repair the standing Release PR body before release-please reads it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: release-please--branches--main
        run: |
          set -uo pipefail

          number=$(gh pr list --state open --head "$RELEASE_BRANCH" --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "No open Release PR on $RELEASE_BRANCH — nothing to repair."
            exit 0
          fi

          # `--jq .body` alone prints the literal `null` for a bodyless PR, which passes
          # the emptiness test below and reaches the sanitizer.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '.body // ""' > "$RUNNER_TEMP/body.md"
          if [ ! -s "$RUNNER_TEMP/body.md" ]; then
            echo "::warning::Release PR #$number carries no body to repair."
            exit 0
          fi

          node packages/pipeline-cli/src/bin.ts release-pr-body sanitize \
            < "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/repaired.md"
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::release-pr-body sanitize exited $status — refusing to guess at the body."
            exit "$status"
          fi

          if [ ! -s "$RUNNER_TEMP/repaired.md" ]; then
            echo "Release PR #$number already parses — no write."
            exit 0
          fi

          jq -Rs '{body: .}' < "$RUNNER_TEMP/repaired.md" \
            | gh api --silent -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" --input -
          echo "::notice::Repaired Release PR #$number's body so release-please can parse it back."

      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          # `secrets.GITHUB_TOKEN` and not an App/PAT, deliberately (#5718). GitHub creates
          # NO workflow run for an event raised with this token, so the branch pushes and
          # the releases this action makes are invisible to Actions — that is the bug, and
          # the repo has no App installation or PAT to swap in, which is a founder act, not
          # a CI one. The fix is the documented `workflow_dispatch` exception instead: the
          # two steps below re-dispatch the work this token's events cannot start. Swapping
          # in an App token later makes both steps redundant; delete them then, and record
          # the swap as an ADR, because it changes how this repo authenticates CI-triggering
          # bots.
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Half one of #5718, and it runs FIRST because an unpublished tag is the worse of the
      # two failures: an npm version that never ships needs a human with a token, while a
      # Release PR missing its checks is fixed by the next push. Ordering plus the kick
      # step's `!cancelled()` below is what makes the two halves fail independently in both
      # directions.
      #
      # `publish.yml` fires on `release: published`, and the releases above are created with
      # `secrets.GITHUB_TOKEN`, so that event starts no run and the tag sits unpublished
      # (`fabrika-cli-v0.2.0` / `pipeline-cli-v0.3.0`, until a human draft-cycled both).
      # Dispatching at `ref: <tag>` reaches publish.yml's own tag-ref + grammar + version
      # gate with the tagged tree checked out, so nothing about what may publish is widened
      # — only what may START the run.
      #
      # Keyed on the PER-PATH outputs for the same reason every gate in this file is: a
      # repo-wide `releases_created` would dispatch a publish for a package that did not
      # release.
      - name: Dispatch the npm publish for each tag this push released
        if: ${{ steps.release.outputs['packages/pipeline-cli--release_created'] == 'true' || steps.release.outputs['packages/fabrika-cli--release_created'] == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIPELINE_CLI_TAG: ${{ steps.release.outputs['packages/pipeline-cli--tag_name'] }}
          FABRIKA_CLI_TAG: ${{ steps.release.outputs['packages/fabrika-cli--tag_name'] }}
        run: |
          # `-e` spelled out because the runner sets it for us: a `run:` block with no
          # `shell:` key executes under `bash --noprofile --norc -eo pipefail`, and every
          # guard below is written for that shell rather than for the repo's `-e`-free
          # script shape (.patterns/skill-script-shell-shape.md), which governs sourced
          # scripts and not workflow steps.
          set -euo pipefail

          tags=()
          [ -n "${PIPELINE_CLI_TAG:-}" ] && tags+=("$PIPELINE_CLI_TAG")
          [ -n "${FABRIKA_CLI_TAG:-}" ] && tags+=("$FABRIKA_CLI_TAG")

          if [ "${#tags[@]}" -eq 0 ]; then
            echo "::error::a per-path release_created output was true but neither tag_name is set — refusing to leave a release unpublished with nothing said about it"
            exit 1
          fi

          for tag in "${tags[@]}"; do
            if ! gh workflow run publish.yml --ref "$tag"; then
              echo "::error::dispatching publish.yml at $tag failed — that release will not reach npm."
              exit 1
            fi
            echo "::notice::dispatched publish.yml at $tag."
          done

      # Half two of #5718. The Release PR is the one PR in this repo whose checks nobody
      # re-reads before merging, and until now it carried whatever the last human
      # close/reopen happened to leave there — stale-but-green reads exactly like ready.
      #
      # `!cancelled()` and not the implicit `success()`: a failed publish dispatch above, or
      # a release-please action that errored after grooming the branch, must not also cost
      # the Release PR its checks. Cancellation is the one case that still skips, because a
      # cancelled run's dispatches would race the run that replaces it.
      #
      # The `for entry in …` list below is workflow file → the required check-run name that
      # file produces, and it is the drift surface: the required set lives in the repo's
      # `main protection` ruleset, not here, so a check added there but not here would never run
      # on the Release PR. Two things make that loud rather than silent — the trigger
      # assertion (a mapped file that lost its `workflow_dispatch:` reds this run), and the
      # dispatch-on-failure stance (an unreadable check-run probe dispatches rather than skips).
      # `ci.yml` carries TWO required checks — `ci-required` and `validate skill frontmatter`
      # — from the same run, so probing the first covers both; one dispatch, one entry.
      - name: Kick the standing Release PR's required checks at its current head
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: release-please--branches--main
        run: |
          # See the publish-dispatch step above for why `-e` is spelled out. Every read
          # whose failure this step wants to HANDLE rather than abort on sits in an `if`
          # condition, which is the only construct errexit exempts.
          set -euo pipefail

          number=$(gh pr list --state open --head "$RELEASE_BRANCH" --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "No open Release PR on $RELEASE_BRANCH — nothing to kick."
            exit 0
          fi

          if ! head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '.head.sha') || [ -z "$head" ]; then
            echo "::error::could not read Release PR #$number's head SHA — refusing to dispatch at a head this run cannot name."
            exit 1
          fi

          if ! reported=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs" --paginate --jq '.check_runs[].name'); then
            echo "::warning::the check-run lookup for $head failed — dispatching every mapped workflow, because a missed dispatch is the stale-green this step exists to end."
            reported=""
          fi

          # A literal list and not a here-doc: a here-doc's terminator has to sit at column 0,
          # which no indented step body can give it, and a `printf | while` puts the loop in
          # a subshell where the `exit 1`s below would abort nothing.
          for entry in "ci.yml=ci-required" "leak-guard.yml=scan changed files for leaks"; do
            file="${entry%%=*}"
            check="${entry#*=}"

            if ! grep -qE '^[[:space:]]*workflow_dispatch:' ".github/workflows/$file"; then
              echo "::error::.github/workflows/$file carries no workflow_dispatch trigger, so the required check '$check' can never run on the Release PR."
              exit 1
            fi

            if printf '%s\n' "$reported" | grep -Fxq "$check"; then
              echo "'$check' already reported at $head — no dispatch."
              continue
            fi

            if ! gh workflow run "$file" --ref "$RELEASE_BRANCH"; then
              echo "::error::dispatching $file at $RELEASE_BRANCH failed — Release PR #$number would keep reading stale-green."
              exit 1
            fi
            echo "::notice::'$check' was missing at Release PR #$number's head $head — dispatched $file."
          done

      # The one gate in this file, keyed on the PER-PATH outputs. `releases_created`
      # appears nowhere.
      - name: Summarize which packages this push released
        if: ${{ steps.release.outputs['packages/pipeline-cli--release_created'] == 'true' || steps.release.outputs['packages/fabrika-cli--release_created'] == 'true' }}
        env:
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
          PIPELINE_CLI_TAG: ${{ steps.release.outputs['packages/pipeline-cli--tag_name'] }}
          FABRIKA_CLI_TAG: ${{ steps.release.outputs['packages/fabrika-cli--tag_name'] }}
        run: |
          set -uo pipefail

          released=()
          while IFS= read -r path; do
            [ -n "$path" ] && released+=("$path")
          done < <(printf '%s' "${PATHS_RELEASED:-[]}" | jq -r '.[]?')

          if [ "${#released[@]}" -eq 0 ]; then
            echo "::error::a per-path release_created output was true but paths_released is empty — refusing to report a release that cannot be named"
            exit 1
          fi

          {
            echo "## Released this push"
            echo
            # the backticks are literal markdown in a printf FORMAT string, so the single
            # quotes are correct; shellcheck reads them as an unexpanded command substitution
            # shellcheck disable=SC2016
            printf -- '- `%s`\n' "${released[@]}"
            echo
            echo "Tags: \`${PIPELINE_CLI_TAG:-none}\` / \`${FABRIKA_CLI_TAG:-none}\`"
            echo
            echo "Publishing is \`publish.yml\` on the \`release: published\` event — not this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  # #5946's second half: this workflow was red on twelve consecutive pushes and nobody
  # noticed for 20 hours, because a red run on `main` shows up nowhere anyone is looking.
  # Release automation going down is silent by nature — no PR turns red, no reviewer is
  # blocked, it just stops. So a failed run files itself into the intake queue triage
  # already drains, and updates that same issue on every later failure.
  #
  # It is a SEPARATE job that checks nothing out, installs nothing, and runs no repo
  # code — deliberately, and this is the whole point of the job boundary. The job above
  # now needs `actions/checkout` and `pnpm install --frozen-lockfile` before it can run
  # `pipeline-cli`, so an alarm living inside it dies with the very failures it exists
  # to report: a bad lockfile on `main` reds the install and takes the alarm down with
  # it, leaving the run red and silent again. Nothing here depends on the repo, so the
  # alarm survives every failure class of the job it watches, including one that leaves
  # no checkout at all.
  #
  # The cost is that the dedup lookup is `gh` rather than `intake-dedup check`, which
  # this job cannot execute. The decision stays the same exact-title equality either
  # way: the search only narrows candidates, and `jq` picks the one whose title matches
  # byte for byte (ADR 0228 — relay an answer, never derive the decision). A missed
  # match costs one duplicate issue, which triage closes; a lost alarm is the failure
  # this job exists to end (ADR 0181), so every refusal here falls toward filing.
  alarm:
    name: file the red run where triage sees it
    needs: release-please
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALARM_TITLE: release-please.yml is failing on pushes to main
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          {
            echo "\`release-please.yml\` failed on \`main\` at commit \`$GITHUB_SHA\`."
            echo
            echo "Failing run: $RUN_URL"
            echo
            echo "Release automation is down while this is red: no version derivation, no changelog"
            echo "grooming on the standing Release PR, and nothing to merge, so no package can ship."
          } > "$RUNNER_TEMP/alarm.md"

          candidates=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 50 \
            --search "\"$ALARM_TITLE\" in:title" --json number,title)
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::the open-issue lookup exited $status — filing a fresh alarm rather than risking a lost one."
            candidates='[]'
          fi

          existing=$(printf '%s' "$candidates" \
            | jq -r --arg title "$ALARM_TITLE" 'map(select(.title == $title)) | .[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body-file "$RUNNER_TEMP/alarm.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALARM_TITLE" \
              --label status:needs-triage --body-file "$RUNNER_TEMP/alarm.md"
          fi
