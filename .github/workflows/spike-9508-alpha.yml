# TEMPORARY — removed before this PR merges. #9508's proof harness.
#
# deploy.yml's own push trigger is `main`-only and widening it would deploy the prod stage
# from a branch, so the alarm job is proven on a copy instead. This file carries the job
# verbatim from deploy.yml, over a fake watched job whose polarity is the one line in
# `spike-9508-result`. `spike-9508-beta.yml` is the same file under a second name: two
# workflows running the same bin in the same repository is exactly the collision the
# per-workflow marker exists to prevent, and it is only observable with two of them.
name: spike 9508 alpha

on:
  push:
    branches: [build/9508-deploy-failure-tracker-9eb38e4e]

permissions:
  contents: read

concurrency:
  group: spike-9508-alpha-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fake-work:
    name: the watched job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - run: test "$(cat spike-9508-result)" = pass

  main-alarm:
    name: report this run to the main alarm
    if: always() && github.event_name == 'push'
    needs: [fake-work]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: package.json

      - name: Open, update or close this workflow's alarm
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'skipped') && 'skipped' || 'success') }}
        run: node packages/fabrika-cli/src/ci/main-alarm-bin.ts --result "$RUN_RESULT"
