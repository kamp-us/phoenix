name: skill-gh-lint

# Four mechanical gates over the skill + agent corpus under `claude-plugins/`, all in fabrika-cli's
# `guard skill-lint check` (the match logic lives once in skill-lint.ts, never re-grepped here):
#   1. REST-only-on-this-org (#743): FAIL on any GraphQL-path `gh` invocation
#      (`gh project`, GraphQL `gh pr/issue edit`, `gh api graphql`).
#   2. Frontmatter YAML validity (#1766): FAIL on any SKILL.md / agents/*.md whose
#      `---`-fenced frontmatter does not parse as strict YAML (the recurring
#      unquoted-`description:`-with-a-colon-space defect that breaks GitHub's renderer).
#   3. Sanctioned push path (#4213): FAIL on a git push invocation in any RUNNABLE block
#      (a fenced shell block, or a whole .sh) — a bare push cannot report whether the ref
#      landed, so `fabrika build push` is the only sanctioned path. Prose ABOUT a bare push
#      is untouched; the skills have to explain why it is forbidden.
#   4. Fence portability (#4605): FAIL on a repo-relative `./claude-plugins/…` path literal
#      inside a fenced block. That literal resolves only inside a phoenix checkout; a
#      marketplace consumer's install lives in their plugin cache, OUTSIDE their repo, so the
#      same fence is `No such file or directory` there.
#
# The scan walks the FULL corpus, not just changed files, so a defect anywhere is caught
# regardless of which PR introduced it. The walk, its zero-scope floor and the per-plugin
# coverage assertion (#5004 — a green from an empty corner is indistinguishable from a green
# from clean code) moved OUT of this file's bash and into the verb when the guard was ported off
# pipeline-cli (#6098), so each of them is now pinned by a unit test instead of living in a shell
# step nothing covers.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint skill corpus for GraphQL-path gh calls + invalid YAML frontmatter + bare git push + non-portable fences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Non-zero on three distinct seats, so a red says which thing happened: 12 a defect was
      # found, 7 zero scope (fail-closed, ADR 0092 — nothing walked, a plugin dir contributed
      # no file, or a check saw none), 11 a read failed so the verdict is UNKNOWN. The report is
      # on stderr, with ::error annotations beside it. Reproduce locally with the same verb.
      - name: Lint skill + agent corpus
        run: node packages/fabrika-cli/src/bin.ts guard skill-lint check
