name: migrations-guard

# Fail-closed CI gate over the committed D1 migrations tree (issue #1435, ADR 0309).
# alchemy applies whatever `.sql` it finds under `migrationsDir` and skips one it has already
# applied by exact relative-path match, so both an edit to a landed migration and a rename of
# one are silent: the edit goes green in integration and leaves prod stale, the rename makes
# alchemy re-apply history against a database that already ran it. This job asserts three
# properties over apps/web/…/migrations — consistency (frozen flat history beside well-formed
# <timestamp>_<name>/ directories), ordering (nothing sorts into applied history), immutability
# (vs packages/migrations-guard/migration-hashes.json) — reusing the guard package's own `check`
# command, so the scan lives once in the tool. The guard package is control-plane (ADR 0100).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: check the D1 migrations tree is consistent, ordered, and immutable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Exit 1 when the migrations tree drifts (a malformed or mis-ordered set, or an edited
      # landed migration vs the committed baseline); the report is on stdout. See #1435.
      - name: Check the D1 migrations tree
        run: node packages/migrations-guard/src/bin.ts check
