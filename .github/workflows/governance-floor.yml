name: governance-floor

# The governance floor made binding (#5408).
#
# The founder vetoed making `claude-plugins/fabrika/**` control-plane and substituted a control: a
# required `governance` verdict on any diff touching a governance root (#5036 comment 5234614633).
# The floor shipped in PR #5231 and it does derive the requirement correctly — but `ship gate` seats
# `blocked` at exit 0, nothing read it, and no workflow invoked it at all, so two fabrika-tree PRs
# (#5293, #5333) merged with no governance verdict after the floor was live. A control that never
# withholds a merge is worse than none, because it looks present.
#
# `fabrika ship floor` is the decision; this job only relays it (ADR 0228). Nothing here decides
# which paths are governance-bearing, which verdict is in force, or whether an author may author one
# — the verb reads the PR's changed files and resolves the verdict through `ship gate` itself, which
# stays the single merge authority.
#
# Since #6161 the verb publishes that decision as a check-run rather than seating it on this job's
# conclusion. A job conclusion is success/failure/cancelled/skipped and nothing else, so "no verdict
# posted at this head yet" — the state every governance-root PR passes through — showed the same red
# as a verdict that is FAIL or bound to another head, and a red meaning "not yet" is a red people
# stop reading. A check-run can stay `in_progress`, so that one state reads as waiting. The verb
# writes it; this job still decides nothing (ADR 0318).
#
# It runs on EVERY pull request with no `paths:` filter on purpose. A YAML path filter is a second
# copy of `GOVERNANCE_ROOTS` that nothing reds when it drifts (#4604); the verb's own read of the
# PR's changed files is the one derivation, and a diff under no governance root is an `n/a` answer
# this job passes on.
on:
  pull_request:
  # `governance floor at head` is bound for the ruleset's required set, and the merge queue awaits a
  # required context on the batched `merge_group` ref — which only a `merge_group:` trigger reaches.
  # Without this arm the flip froze every merge in the repo for ~40 minutes on 2026-08-21 (#6968),
  # the same failure ADR 0132 records for `ci-required`. The batch is served by the `batch` job
  # below, never by `floor`: a batch ref has no `github.event.pull_request` to resolve a floor over.
  merge_group:

# Least-privilege: the job checks out the repo and reads the PR's metadata, changed files, comments,
# reviews and the comment authors' repository permission (the ADR 0055 write+ gate), and writes the
# one check-run the verb publishes its answer on. It posts no status and no comment.
permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  floor:
    name: a governance-root diff carries a governance verdict at its head
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0`, not the action's default 1. Under ADR 0276 `ship floor` resolves a
      # content-bound verdict at a moved head by reading `git diff --raw <base>...<head>`, and a
      # depth-1 checkout cannot: measured on a synthetic origin, both of `bindHead`'s fetches
      # succeed and the three-dot read still dies `fatal: … no merge base`. That fails safe — the
      # namespace resolves stale and the floor reds — but red is exactly the re-review this ruling
      # removes, so a shallow checkout would keep the tax for governance-root PRs alone.
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Exit 0 = the verb published its answer as the `governance floor at head` check-run, whatever
      # that answer was — the floor's own polarity is that check-run's, not this job's. A non-zero
      # here is the one fact this job still carries: the answer could not be published at all, which
      # is UNKNOWN and never a pass (ADR 0092), so the job reds and a human reads why on stderr.
      - name: Publish whether the governance floor is discharged at this head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_PIPELINE_REPO: ${{ github.repository }}
        run: |
          node packages/fabrika-cli/src/bin.ts ship floor \
            ${{ github.event.pull_request.number }} \
            --sha ${{ github.event.pull_request.head.sha }} \
            --publish-check

  # The queue's half of the same context. `floor` above cannot serve it: on a `merge_group` event
  # `github.event.pull_request` is empty, so it would ask the verb about PR #0 at an empty head.
  #
  # This job publishes the row and derives nothing, because a batch ref carries nothing to derive
  # from — no PR number, no comments, no reviews. The floor is still held where it was: each PR in
  # the batch was gated at its own head by the `floor` job, and `ship gate` refuses a governance-root
  # PR whose verdict is absent, stale or FAIL before `ship enqueue` is reached. `floor-batch` is a
  # verb, not a bash decision, so the required context's NAME lives once in `CHECK_RUN_NAME` — a job
  # named after it here would be a second copy that nothing reds when it drifts (ADR 0228, #6968).
  #
  # The default shallow checkout is enough: nothing here reads git history.
  batch:
    name: the batch ref carries the floor's context by construction
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same relay contract as the PR job: exit 0 means the check-run landed, and a non-zero means it
      # could not be published — UNKNOWN, so the job reds and the queue holds rather than merging.
      - name: Publish the floor's required context on the batch ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_PIPELINE_REPO: ${{ github.repository }}
        run: |
          node packages/fabrika-cli/src/bin.ts ship floor-batch \
            --sha ${{ github.event.merge_group.head_sha }}
