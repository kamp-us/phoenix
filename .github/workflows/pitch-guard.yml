name: pitch-guard

# CI teeth for #3963 (founder ruling #3909): lane-entering work only becomes pickable carrying a
# founder-approved pitch. The check lives once in fabrika-cli (`guard pitch-guard check`); this
# workflow is the surface that calls it.
#
# THE TRIGGER SHAPE IS THE WHOLE DESIGN — read it before adding one.
#
# There is deliberately NO `pull_request` and NO `merge_group` trigger. Founder no-go #3909 rejects a
# merge-blocking conformance gate on shipped work: a finished PR must never fail for direction.
# Copying the `pull_request:` shape of the other fail-closed guards (catalog-guard, fanout-guard,
# readme-guard, path-filter-guard) would land exactly the thing the founder rejected. Do not add one.
# A pitch is a property of a BET at intake, not of a diff.
#
# The teeth land at the intake seam instead — the moment `status:triaged` makes an issue pickable —
# which is also what ADR 0202 demands ("teeth belong at the seam, not in a sweep"). Same shape as
# homing-guard, minus its schedule.
#
# NO `schedule:` BACKSTOP, deliberately. homing-guard carries a weekly board-wide sweep that files a
# status:needs-triage issue on drift; this one must not, for two reasons. (1) It would be the sweep
# ADR 0202 rules out, re-adding attention-based enforcement next to the seam that already has teeth.
# (2) The board's in-scope bets are still overwhelmingly unpitched, so a periodic board-wide run
# would red and file every week: a signal that fires on everything is a signal nobody reads. Arming a
# periodic sweep is a separate, later decision (#4174); the per-issue trigger is what keeps that
# decision cheap, because this workflow never looks at an issue that is not moving through the seam.
on:
  # The seam: an issue being stamped `status:triaged` is the moment it enters the lane. The job
  # scopes to THAT issue, so a red names the bet that just became pickable unpitched — never the
  # backlog. Other label changes are filtered out in the job's `if` below: a `p1` added to an issue
  # triaged weeks ago is not a lane entry.
  issues:
    types: [labeled]
  # The board-wide view, on demand only. Manual by construction, so its red is a report a human asked
  # for rather than a recurring alarm. Leave `issue` blank to scan the whole open lane-entering
  # backlog, or name one issue to re-check it after a pitch is drafted and approved.
  workflow_dispatch:
    inputs:
      issue:
        description: "Check one issue (blank = the whole open lane-entering backlog)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN: the job reads issues, their comments, and each comment author's
# collaborator permission (the ADR 0055 write+ trust root), and fails via exit code — it files
# nothing and posts nothing, so it needs no write scope. Were the permission endpoint ever denied,
# the guard's ACL resolution is fail-closed (`pitch-verb.ts`): an unreadable permission resolves NOT
# authorized, so approval stops counting and the job reds — loud, never a silent green.
permissions:
  contents: read
  issues: read

jobs:
  check:
    name: check every pickable bet carries a founder-approved pitch
    # Only a `status:triaged` stamp is a lane entry. Without this filter every unrelated label edit on
    # an already-triaged issue would re-red it, which is the backlog-wide pressure the missing
    # `schedule:` above exists to avoid. `workflow_dispatch` carries no label and always runs.
    if: ${{ github.event_name != 'issues' || github.event.label.name == 'status:triaged' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # An `issues` event (or a dispatch naming one) scopes the scan to that issue; a bare dispatch
      # scans the whole open lane-entering backlog. A non-zero exit reds the run — which is the entire
      # consequence: an issue event has no merge path, so nothing is blocked. Remediation (triage
      # drafts the five fields, the founder approves with a `pitch-approved:` comment) is printed by
      # the guard itself. 7 is an empty backlog sweep, 11 an unreadable board, 12 an unpitched bet.
      - name: pitch-guard check
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          if [ -n "$ISSUE" ]; then
            node packages/fabrika-cli/src/bin.ts guard pitch-guard check --issue "$ISSUE"
          else
            node packages/fabrika-cli/src/bin.ts guard pitch-guard check
          fi
