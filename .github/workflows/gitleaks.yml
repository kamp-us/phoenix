name: gitleaks

# CI credential scanner (issue #2325). gitleaks scans the files this change adds or edits,
# as they stand at HEAD, for secrets — API keys, tokens, private keys — its actual domain,
# additive to and orthogonal from leak-guard (machine-local-path/PII in doc surfaces; the
# #2310 spike measured stock gitleaks at 0/6 on leak-guard's corpus). CI is the enforcement
# surface, not a pre-commit hook: the lean lefthook fires in harness-created worktrees
# with a stripped PATH where a Go binary is unreliable (#2310), and CI is the only gate
# that sees every PR's diff however it was authored.
#
# Scope is the merge result — the tree this change would land, read through the three-dot
# diff against the base, exactly the basis leak-guard.yml uses. So a literal a later commit
# removed reads clean and an ordinary head-fix clears the gate. ADR 0338 rules that scope and
# names what it gives up: a secret added and reverted inside one PR is no longer caught here.
# Full history stays out of scope either way — the repo's git history already carries triaged
# findings (issue #2325 baseline), and a real secret already in history is a separate
# rotation/remediation incident, never suppressed here.
# Least-privilege token: the job only checks out and scans the repo (SARIF is written to
# the runner's disk, never uploaded to code-scanning, and nothing comments/checks the PR),
# so read-only `contents` is all it needs — no default write scopes on a control-plane gate.
permissions:
  contents: read

on:
  # No `push: main` (#5085): this scan's scope IS the diff — the files `base...HEAD` reports
  # as added or edited — so a `main` run would have no such diff to read and would fall back
  # to the whole tree, reding on the triaged #2325 baseline every time.
  pull_request:
  # `scan PR commits for secrets` is intended as a branch-protection-REQUIRED status
  # check, so the merge queue awaits it on the batched `merge_group` ref before it can
  # merge; without this trigger that required check never runs on the batch and every
  # queued merge hangs (ADR 0132) — same wiring as leak-guard.yml.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned gitleaks binary — a CI binary, NOT a pnpm catalog: dependency, so it is pinned
  # here by version + checksum, never a floating `latest`. Bump both together on upgrade.
  GITLEAKS_VERSION: "8.21.2"
  GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba" # gitleaks_8.21.2_linux_x64.tar.gz

jobs:
  scan:
    # Frozen string. It is the branch-protection required check the merge queue awaits
    # (ADR 0132), so renaming it hangs every queued merge. The name predates ADR 0338 and
    # no longer describes the scope: this job reads the merge result's tree, not commits.
    name: scan PR commits for secrets
    runs-on: ubuntu-latest
    steps:
      # Full history so the merge-base of base + HEAD resolves; the default shallow
      # checkout has no merge-base for the three-dot diff below.
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      # Install the pinned gitleaks binary and verify its checksum. A version-only pin
      # can still be swapped under the same tag; the checksum makes the binary itself
      # immutable — refuse to run on a mismatch (fail-closed).
      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -sSLf -o "$tarball" "$url"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      # Scan of the merge result: the files this change adds or edits, read at HEAD. On
      # `pull_request` the base is the target branch; on the merge queue's batched
      # `merge_group` ref `base_ref` is empty, so we use `merge_group.base_sha` — the base
      # commit the queue built the batch on (ADR 0132) — yielding exactly the files the
      # batch adds vs main.
      #
      # Exit-code contract (grounded in the #2310 spike against gitleaks source):
      #   0   = clean               -> PASS (the ONLY passing outcome)
      #   3   = findings            -> FAIL (a secret in the merge result) — `--exit-code 3`
      #                               dodges gitleaks' reserved codes so a finding is
      #                               DISTINGUISHABLE from a tool failure
      #   1   = fatal/partial scan  -> FAIL
      #   2   = panic (bad rule)    -> FAIL   (why 3, not 2, is the finding code)
      #   126 = bad flag            -> FAIL
      #   *   = anything else       -> FAIL
      # Fail-closed: only exit 0 passes; a finding OR any error fails the job.
      - name: Scan the merge result for secrets
        env:
          BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          # `set +e` first: a `run:` block inherits errexit from the shell GitHub invokes, and
          # `set -uo pipefail` does not clear it — so without this the refusals below abort
          # before they print, and the scanner's own exit code is never read.
          # See .patterns/skill-script-shell-shape.md, "the workflow-step class".
          set +e
          set -uo pipefail
          # Fetch the base WITH ancestry (no --depth=1): a shallow base has no history, so
          # it shares no merge-base with HEAD and the three-dot diff below cannot resolve
          # the file set — which this step refuses rather than reads as empty.
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "$BASE_REF"
            base="origin/$BASE_REF"
          else
            git fetch --no-tags origin "$MERGE_GROUP_BASE_SHA"
            base="$MERGE_GROUP_BASE_SHA"
          fi
          # Resolved on its own line, and read inside an `if`, so an unresolvable base fails
          # closed under this step's own `::error::` instead of the runner's bare abort.
          if ! mergebase="$(git merge-base "$base" HEAD)" || [ -z "$mergebase" ]; then
            echo "::error::could not resolve merge-base of ${base} and HEAD — refusing to scan a degenerate range (fail-closed)."
            exit 1
          fi
          # base...HEAD = the files this change adds or edits vs that merge-base
          # (--diff-filter=ACMR drops deletions and rename sources), the same basis
          # leak-guard.yml uses. Also read inside an `if`: a failed diff prints nothing, and
          # the emptiness test below would take that for a clean scan.
          if ! diff_out="$(git diff --name-only --diff-filter=ACMR "$base...HEAD")"; then
            echo "::error::could not diff ${base}...HEAD — refusing to report a clean scan over a file set that never resolved."
            exit 1
          fi
          changed=()
          while IFS= read -r f; do
            [ -n "$f" ] && changed+=("$f")
          done <<< "$diff_out"
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changed files — nothing to scan."
            exit 0
          fi
          # `gitleaks dir` takes at most ONE path and plain-walks it (v8.21.2
          # cmd/directory.go `len(args) == 1`, sources/directory.go `filepath.Walk`), so the
          # changed files are mirrored into a staging tree at their repo-relative paths and
          # that tree is scanned whole. The repo's allowlist matches a finding's VALUE, not
          # its path (`regexTarget = "match"` in .gitleaks.toml), so relocating the files
          # cannot widen it. `-P` keeps a changed symlink a symlink — gitleaks skips those
          # without --follow-symlinks, where following a broken one would red a clean PR.
          if ! staging="$(mktemp -d)" || [ -z "$staging" ]; then
            echo "::error::could not allocate a staging directory — refusing to report a clean scan over files that were never staged."
            exit 1
          fi
          for f in "${changed[@]}"; do
            if ! mkdir -p "${staging}/$(dirname "$f")" || ! cp -P -- "$f" "${staging}/${f}"; then
              echo "::error::could not stage ${f} for scanning — refusing to report a clean scan over an incomplete file set."
              exit 1
            fi
          done
          printf 'Scanning %d changed file(s) at HEAD:\n' "${#changed[@]}"
          printf '  %s\n' "${changed[@]}"
          echo "Report paths carry the ${staging}/ prefix; strip it for the repo path."
          ./gitleaks dir "$staging" \
            --config=.gitleaks.toml \
            --no-banner \
            --redact \
            --exit-code 3 \
            --report-format sarif \
            --report-path gitleaks.sarif
          code=$?
          case "$code" in
            0)   echo "gitleaks: clean — no secrets in the files this change adds or edits."; exit 0 ;;
            3)   echo "::error::gitleaks found a secret in a file this PR adds or edits. Remove it at HEAD, rotate it, and (if a real credential) treat the leak as an incident — do NOT allowlist a real secret."; exit 1 ;;
            1)   echo "::error::gitleaks fatal/partial scan error (exit 1) — treating as fail-closed."; exit 1 ;;
            2)   echo "::error::gitleaks panic (exit 2, e.g. a malformed rule) — treating as fail-closed."; exit 1 ;;
            126) echo "::error::gitleaks bad flag/invocation (exit 126) — treating as fail-closed."; exit 1 ;;
            *)   echo "::error::gitleaks unexpected exit code ${code} — treating as fail-closed."; exit 1 ;;
          esac
